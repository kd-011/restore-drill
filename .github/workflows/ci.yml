name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install optional tools so every drill type is exercised
        run: sudo apt-get update && sudo apt-get install -y age restic zstd xz-utils zip unzip gnupg
      - run: node --test
