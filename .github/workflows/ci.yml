name: ci

on:
  push:
    branches: [main]
  pull_request:
  # A merge made with GITHUB_TOKEN (auto-merge) does not trigger the push run,
  # so this keeps the badge honest.
  schedule:
    - cron: "41 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node --test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install optional tools so every drill type is exercised
        run: sudo apt-get update && sudo apt-get install -y age restic zstd xz-utils zip unzip gnupg
      - run: node --test
